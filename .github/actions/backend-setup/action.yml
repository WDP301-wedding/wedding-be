name: Backend dependencies
description: Restore exact locked dependencies and generate the Prisma client when needed.
inputs:
  generate-client:
    description: Generate the application Prisma client.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.node-version'
        cache: npm

    - name: Restore locked node_modules
      id: dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-backend-node-modules-${{ hashFiles('package-lock.json', '.node-version') }}

    - name: Install locked dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Generate Prisma client
      if: inputs.generate-client == 'true'
      shell: bash
      run: npm run db:generate
