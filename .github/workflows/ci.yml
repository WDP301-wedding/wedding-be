name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run backend unit, contract, integration, and coverage tests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, test, build, and audit gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify generated OpenAPI artifact
        run: npm run api:check

      - name: Build production output
        run: npm run build

      - name: Audit locked dependencies
        run: npm run audit:ci

  postgresql-integration:
    name: PostgreSQL migration and integration gates
    runs-on: ubuntu-latest
    # Native owner integration (~5 minutes) plus the full coverage rerun exceed 10.
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: wedding_ci
          POSTGRES_USER: wedding_ci
          POSTGRES_PASSWORD: wedding_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedding_ci -d wedding_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
      MIGRATION_DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
      TEST_MIGRATION_DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy migrations to empty PostgreSQL
        run: npm run db:migrate:deploy

      # Single complete coverage run with PostgreSQL covers unit, contract, and integration without redundant duplicate runs.
      - name: Enforce full-suite coverage with PostgreSQL
        if: ${{ inputs.run_tests == true || inputs.run_tests == 'true' }}
        run: npm run test:coverage -- --maxWorkers=2
