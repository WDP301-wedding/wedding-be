name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede PR checks, but let an active production deployment finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare backend dependencies
        uses: ./.github/actions/backend-setup

      - name: Lint
        run: npm run lint

  production:
    name: Production build, contract, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare backend dependencies
        uses: ./.github/actions/backend-setup

      - name: Typecheck
        run: npm run typecheck

      - name: Verify realtime authentication admission
        run: npx vitest run tests/integration/realtime-auth-admission.test.ts --maxWorkers=1

      - name: Verify health probes remain available under API rate limiting
        run: npx vitest run tests/integration/health.test.ts tests/integration/security.test.ts --maxWorkers=1

      - name: Verify generated OpenAPI artifact
        run: npm run api:check

      - name: Verify backend API and CI contracts
        run: npm run test:contract

      - name: Verify pinned canonical Content renderer
        run: npm run print:check

      - name: Verify backend unit regressions
        # New snapshots use the same offline Content-tab DOM/CSS as the web.
        # Historical PDFKit snapshots still run through their retained renderer.
        run: |
          npx playwright-core install --with-deps --only-shell chromium
          npm run test:unit -- --maxWorkers=2

      - name: Build production output
        run: npm run build

      - name: Audit locked dependencies
        if: ${{ !cancelled() }}
        run: npm run audit:ci

  quality:
    # Preserve the existing check name for branch protection and release consumers.
    name: Static, test, build, and audit gates
    needs: [lint, production, postgresql-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every backend gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          MIGRATIONS_RESULT: ${{ needs.postgresql-integration.result }}
        run: |
          printf 'Lint: %s; production: %s; migrations: %s\n' "$LINT_RESULT" "$PRODUCTION_RESULT" "$MIGRATIONS_RESULT"
          [[ "$LINT_RESULT" == success && "$PRODUCTION_RESULT" == success && "$MIGRATIONS_RESULT" == success ]]

  postgresql-integration:
    name: PostgreSQL migration and integration gates
    # Keep Chromium's system dependencies stable as ubuntu-latest advances.
    # Fresh font downloads can outlast the original ten-minute job budget.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: wedding_ci
          POSTGRES_USER: wedding_ci
          POSTGRES_PASSWORD: wedding_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedding_ci -d wedding_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
      MIGRATION_DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
      TEST_MIGRATION_DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare backend dependencies
        uses: ./.github/actions/backend-setup
        with:
          generate-client: 'false'

      - name: Deploy migrations to empty PostgreSQL
        run: npm run db:migrate:deploy

      - name: Generate Prisma client for native acceptance
        run: npm run db:generate

      - name: Install retained-content print browser
        run: npx playwright-core install --with-deps --only-shell chromium

      - name: Verify booking overview and invitation publication through native owners
        run: |
          npx vitest run tests/integration/booking-lifecycle/experience.test.ts --maxWorkers=1
          npx vitest run tests/integration/invitation-studio/studio-waves.test.ts --maxWorkers=1 -t 'publish|publication|unpublish|public'

      - name: Verify appendix print consent, production synchronization and money races
        run: npx vitest run tests/integration/commercial-contracts-api.test.ts --maxWorkers=1 -t 'appendix print requests:'

      - name: Verify demo final invoice and strict settlement policy
        run: npx vitest run tests/integration/commercial-contracts-api.test.ts --maxWorkers=1 -t 'demo finalizes|strict mode refuses|demo settlement rejects'

      - name: Verify contract PDF preview and mutual approval lock
        run: npx vitest run tests/integration/commercial-contracts-api.test.ts --maxWorkers=1 -t 'previews the submitted terms|returns a submitted contract for changes'

      - name: Verify authenticated retained PDF and Seating downloads
        run: npx vitest run tests/integration/invitation-studio/print-file.test.ts tests/integration/seating-print-files.test.ts tests/integration/print-booking-summary.test.ts --maxWorkers=1
