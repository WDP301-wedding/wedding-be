name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede PR checks, but let an active production deployment finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare backend dependencies
        uses: ./.github/actions/backend-setup

      - name: Lint
        run: npm run lint

  production:
    name: Production build, contract, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare backend dependencies
        uses: ./.github/actions/backend-setup

      - name: Typecheck
        run: npm run typecheck

      - name: Verify generated OpenAPI artifact
        run: npm run api:check

      - name: Build production output
        run: npm run build

      - name: Audit locked dependencies
        if: ${{ !cancelled() }}
        run: npm run audit:ci

  quality:
    # Preserve the existing check name for branch protection and release consumers.
    name: Static, test, build, and audit gates
    needs: [lint, production, postgresql-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every backend gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          MIGRATIONS_RESULT: ${{ needs.postgresql-integration.result }}
        run: |
          printf 'Lint: %s; production: %s; migrations: %s\n' "$LINT_RESULT" "$PRODUCTION_RESULT" "$MIGRATIONS_RESULT"
          [[ "$LINT_RESULT" == success && "$PRODUCTION_RESULT" == success && "$MIGRATIONS_RESULT" == success ]]

  postgresql-integration:
    name: PostgreSQL migration and integration gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: wedding_ci
          POSTGRES_USER: wedding_ci
          POSTGRES_PASSWORD: wedding_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedding_ci -d wedding_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
      MIGRATION_DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
      TEST_MIGRATION_DATABASE_URL: postgresql://wedding_ci:wedding_ci_only@127.0.0.1:5432/wedding_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare backend dependencies
        uses: ./.github/actions/backend-setup
        with:
          generate-client: 'false'

      - name: Deploy migrations to empty PostgreSQL
        run: npm run db:migrate:deploy

