# Free migration trial. See docs/render-migration-2026-10-22.md before cutover.
databases:
  - name: wedding-db-render-trial
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    databaseName: wedding_db_render_trial
    user: wedding_db_render_trial_user
    ipAllowList: []

services:
  - type: web
    name: wedding-be-render-trial
    runtime: docker
    repo: https://github.com/WDP301-wedding/wedding-be
    branch: codex/render-migration-20261022
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off'
    numInstances: 1
    # Render's fromDatabase connectionString has no query string. Require TLS on
    # the private network; libpq-compatible require supports Render's internal CA.
    # No migration runs at startup: import and compare the new DB first.
    dockerCommand: >-
      /bin/sh -c 'export DATABASE_URL="${DATABASE_URL}?sslmode=require&uselibpqcompat=true";
      export MIGRATION_DATABASE_URL="${MIGRATION_DATABASE_URL}?sslmode=require&uselibpqcompat=true";
      exec node --enable-source-maps --import ./dist/instrumentation.js dist/server.js'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db-render-trial
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: wedding-db-render-trial
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: BACKEND_REPLICA_COUNT
        value: '1'
      - key: AUTH_TRUST_PROXY_HOPS
        value: '1'
      - key: DB_POOL_MAX
        value: '1'
      - key: DB_POOL_MAX_VENUE_CATALOG
        value: '3'
      - key: DB_POOL_MAX_ANALYTICS
        value: '2'
      - key: DB_POOL_ACQUIRE_TIMEOUT_MS
        value: '10000'
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: '60000'
      - key: DB_PLANNED_PROCESSES
        value: '2'
      - key: DB_MAX_CONNECTIONS
        value: '60'
      - key: DB_CONNECTION_RESERVE
        value: '36'
      - key: DB_DIAGNOSTICS_ENABLED
        value: 'false'
      - key: DB_SAFE_READ_DEADLINE_ENABLED
        value: 'false'
      - key: PERF_READONLY_DB_PROBE
        value: 'false'
      - key: SEATING_RECONCILER_ENABLED
        value: 'false'
      - key: NOTIFICATIONS_WORKER_ENABLED
        value: 'false'
      - key: NOTIFICATIONS_FCM_ENABLED
        value: 'false'
      - key: AI_IMAGE_JOBS_ENABLED
        value: 'false'
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_OTP_HASH_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      # Preserve the approved identity policy and existing provider secrets via
      # a secure config transfer before starting. Never place values in Git.
      - key: LOG_LEVEL
        value: 'info'
      - key: RESTAURANT_TIME_ZONE
        value: 'Asia/Ho_Chi_Minh'
      - key: HTTP_BODY_LIMIT_BYTES
        value: '1048576'
      - key: HTTP_REQUEST_TIMEOUT_MS
        value: '60000'
      - key: RATE_LIMIT_MAX_REQUESTS
        value: '100'
      - key: RATE_LIMIT_WINDOW_MS
        value: '60000'
      - key: OPENAPI_ENABLED
        value: 'true'
      - key: AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: '1800'
      - key: AUTH_DISABLED_ACCOUNT_PII_RETENTION_DAYS
        value: '365'
      - key: AUTH_INVITATION_REISSUE_LIMIT
        value: '3'
      - key: AUTH_INVITATION_REISSUE_WINDOW_SECONDS
        value: '86400'
      - key: AUTH_INVITATION_RETENTION_DAYS
        value: '180'
      - key: AUTH_INVITATION_TTL_SECONDS
        value: '259200'
      - key: AUTH_LOGIN_RATE_LIMIT_MAX
        value: '10'
      - key: AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: '900'
      - key: AUTH_PASSWORD_MAX_BYTES
        value: '512'
      - key: AUTH_PASSWORD_MAX_CHARACTERS
