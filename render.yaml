      - key: AUTH_PASSWORD_MIN_CHARACTERS
        value: '12'
      - key: AUTH_PASSWORD_RESET_RETENTION_DAYS
        value: '30'
      - key: AUTH_PASSWORD_RESET_TTL_SECONDS
        value: '1800'
      - key: AUTH_REFRESH_ABSOLUTE_TTL_SECONDS
        value: '7776000'
      - key: AUTH_REFRESH_IDLE_TTL_SECONDS
        value: '2592000'
      - key: AUTH_REFRESH_RATE_LIMIT_MAX
        value: '60'
      - key: AUTH_REFRESH_RATE_LIMIT_WINDOW_SECONDS
        value: '900'
      - key: AUTH_RESET_REQUEST_RATE_LIMIT_MAX
        value: '3'
      - key: AUTH_RESET_REQUEST_RATE_LIMIT_WINDOW_SECONDS
        value: '3600'
      - key: AUTH_SCRYPT_BLOCK_SIZE
